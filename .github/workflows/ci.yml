name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Scan for secrets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2

  validate:
    name: Validate configuration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate docker-compose.yml
        run: |
          # Provide a dummy token so the required variable check passes during validation
          export N8N_RUNNERS_AUTH_TOKEN=ci-placeholder
          docker compose config --quiet

      - name: Check .env.sample exists and has required keys
        run: |
          required_keys=(
            "N8N_HOST"
            "N8N_PORT"
            "N8N_BIND_ADDRESS"
            "N8N_PROTOCOL"
            "N8N_SECURE_COOKIE"
            "N8N_RUNNERS_AUTH_TOKEN"
            "N8N_DATA_PATH"
            "CLOUDFLARE_TUNNEL_NAME"
            "CLOUDFLARE_HOSTNAME"
          )
          missing=0
          for key in "${required_keys[@]}"; do
            if ! grep -q "^${key}=" .env.sample; then
              echo "Missing key in .env.sample: $key"
              missing=1
            fi
          done
          if [ "$missing" -eq 1 ]; then
            exit 1
          fi
          echo "All required keys present in .env.sample"

      - name: Verify launch.py is executable
        run: |
          if [ ! -x "scripts/launch.py" ]; then
            echo "Not executable: scripts/launch.py"
            exit 1
          fi
          echo "scripts/launch.py is executable"

      - name: Check launch.py syntax
        run: python3 -m py_compile scripts/launch.py

      - name: Verify no stray shell/batch scripts remain
        run: |
          if compgen -G "scripts/*.sh" > /dev/null || compgen -G "scripts/*.bat" > /dev/null; then
            echo "Found leftover .sh/.bat scripts — everything should live in scripts/launch.py"
            exit 1
          fi
          echo "scripts/ contains only launch.py"
